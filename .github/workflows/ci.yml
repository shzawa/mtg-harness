name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_url:
        description: Optional Google Meet /meet/ URL to verify without joining
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome-extension
          path: .output/chrome-mv3/
          include-hidden-files: true
          if-no-files-found: error
      - name: Verify live Meet page without joining
        if: github.event_name == 'workflow_dispatch' && inputs.live_url != ''
        env:
          LIVE_MEET_URL: ${{ inputs.live_url }}
        run: node scripts/check-live-url.mjs
      - name: Upload live page verification
        if: always() && github.event_name == 'workflow_dispatch' && inputs.live_url != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-meet-verification
          path: test-results/live-meet.*
          if-no-files-found: error
