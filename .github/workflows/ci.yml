name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_url:
        description: Optional Google Meet /meet/ URL to verify without joining
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_needed: ${{ steps.release-plan.outputs.release_needed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install pinned toolchain
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./bin/mise install --locked
          ./bin/mise env --paths >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: Verify full action versions against upstream tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm actions:check --verify-upstream
      - run: node scripts/release.ts --metadata
      - name: Plan release without write permissions
        id: release-plan
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.ts --check-release >> "$GITHUB_OUTPUT"
      - name: Check project and prepare Chromium
        shell: bash
        run: |
          pnpm check &
          checks_pid=$!
          pnpm test:e2e:deps &
          deps_pid=$!
          pnpm test:e2e:install &
          browser_pid=$!
          ci_status=0
          for ci_pid in "$checks_pid" "$deps_pid" "$browser_pid"; do
            if ! wait "$ci_pid"; then ci_status=1; fi
          done
          exit "$ci_status"
      - run: pnpm zip
      - run: pnpm license:check
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome-extension
          path: .output/chrome-mv3/
          include-hidden-files: true
          if-no-files-found: error
      - name: Save tested release ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: .output/*-chrome.zip
          include-hidden-files: true
          if-no-files-found: error
      - name: Verify live Meet page without joining
        if: github.event_name == 'workflow_dispatch' && inputs.live_url != ''
        env:
          LIVE_MEET_URL: ${{ inputs.live_url }}
        run: node scripts/check-live-url.ts
      - name: Upload live page verification
        if: always() && github.event_name == 'workflow_dispatch' && inputs.live_url != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-meet-verification
          path: test-results/live-meet.*
          if-no-files-found: error

  release:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.check.outputs.release_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned toolchain
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./bin/mise install --locked
          ./bin/mise env --paths >> "$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: release-assets
      - name: Publish versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.ts
