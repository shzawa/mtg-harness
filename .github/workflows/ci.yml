name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_url:
        description: Optional Google Meet /meet/ URL to verify without joining
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned toolchain
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: ./bin/mise install --locked
      - run: ./bin/setup
      - run: ./bin/mise exec -- pnpm audit --audit-level high
      - run: ./bin/mise exec -- node scripts/release.ts --metadata
      - run: ./bin/mise exec -- pnpm format:check
      - run: ./bin/mise exec -- pnpm lint
      - run: ./bin/mise exec -- pnpm typecheck
      - run: ./bin/mise exec -- pnpm test:release
      - run: ./bin/zip
      - run: ./bin/mise exec -- pnpm exec playwright install --with-deps chromium
      - run: ./bin/mise exec -- pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome-extension
          path: .output/chrome-mv3/
          include-hidden-files: true
          if-no-files-found: error
      - name: Save tested release ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: .output/*-chrome.zip
          include-hidden-files: true
          if-no-files-found: error
      - name: Verify live Meet page without joining
        if: github.event_name == 'workflow_dispatch' && inputs.live_url != ''
        env:
          LIVE_MEET_URL: ${{ inputs.live_url }}
        run: ./bin/mise exec -- node scripts/check-live-url.ts
      - name: Upload live page verification
        if: always() && github.event_name == 'workflow_dispatch' && inputs.live_url != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-meet-verification
          path: test-results/live-meet.*
          if-no-files-found: error

  release:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned toolchain
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: ./bin/mise install --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: release-assets
      - name: Publish versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./bin/mise exec -- node scripts/release.ts
